<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Candle</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <script src="index.js"></script>
    <div id="main-container">
        <div id="fast-forward-row">
            <button class="fast-forward-button" id="fast-forward-button-1">></button>
            <button class="fast-forward-button" id="fast-forward-button-2">>></button>
            <button class="fast-forward-button" id="fast-forward-button-3">>>></button>
        </div>
        <div id="graph-row">
            <img id="graph" src="https://img.magnific.com/free-vector/dynamic-financial-chart-with-candlestick-patterns_1308-182619.jpg?semt=ais_hybrid&w=740&q=80">
        </div>
        <div class="news-event">
            <div id="news-event-1">
            The Lynx have won the 2027 WNBA Finals!
            </div>
            <div id="news-info-1">
                25 Oct 18:45
            </div>
        </div>
        <div id="info-container">
            <div id="wallet-row">
                <span>Balance:</span>
                <span id="balance-amount">$10,999</span>
            </div>
            <div class="options-row" id="options-row-1">
                <span class="stock-name" id="stock-name-1">PL1</span>
                <span class="stock-price" id="stock-price-1">$300</span>  
                <input type="text" class="stock-amount-input" id="stock-amount-input-1">
            </div>
            <div class="owned-info">
                <span class="stock-owned" id="stock-owned-1">3 owned</span>
                <span class="owned-stock-value" id="owned-stock-value-1">{$900}</span>
                
            </div>
            <div class="options-row" id="options-row-2">
                <span class="stock-name" id="stock-name-2">PL2</span>
                <span class="stock-price" id="stock-price-2">$200</span>
                <input type="text" class="stock-amount-input" id="stock-amount-input-2">
            </div>
            <div class="owned-info">
                <span class="stock-owned" id="stock-owned-2"> 4 owned</span>
                <span class="owned-stock-value" id="owned-stock-value-2">{$800}</span> 
            </div>
            <div class="options-row" id="options-row-3">
                <span class="stock-name" id="stock-name-3">PL3</span>
                <span class="stock-price" id="stock-price-3">$1337</span>
                <input type="text" class="stock-amount-input" id="stock-amount-input-3">
            </div>
            <div class="owned-info">
                <span class="stock-owned" id="stock-owned-2">2 owned</span>
                <span class="owned-stock-value" id="owned-stock-value-2">{$2667}</span>
            </div>
            <div id="buy-sell-row">
                <button class="buy-sell-button" id="buy-button">Buy</button>
                <button class="buy-sell-button" id="sell-button">Sell</button>
            </div>
        </div>
    </div>
  </body>
</html>
